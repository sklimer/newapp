version: '3.8'

services:
  # Ваш существующий SSL-прокси (оставляем без изменений)
  router:
    image: valian/docker-nginx-auto-ssl
    environment:
      ALLOWED_DOMAINS: 'dev.proxy.example.com'
      # Подключаем оба сервиса
      SITES: 'dev.proxy.example.com=dev-tunnel:8888;'
    volumes:
      - ./DATA/nginx/ssl:/etc/resty-auto-ssl
    ports:
      - 443:443
      - 80:80
    restart: always
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: '5m'

  # SSH tunnel - расширяем конфигурацию
  dev-tunnel:
    image: antoniomika/sish:latest
    volumes:
      - ./DATA/proxy/pubkeys:/pubkeys
      - ./DATA/proxy/keys:/keys
    ports:
      - 2222:2222
      - "8000:8000"  # Пробрасываем порт Uvicorn наружу
    command: |
      --ssh-address=:2222
      --http-address=:8888
      --https-address=:8443
      --authentication-keys-directory=/pubkeys
      --private-keys-directory=/keys
      --redirect-root=false
      --bind-random-ports=false
      --bind-random-subdomains=false
      --domain=proxy.example.com
      --tcp-aliases=dev=localhost:5173
      # Добавляем туннель для API
      --tcp-aliases=api=localhost:8000
    restart: always
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: '5m'

  # Vite dev server
  frontend:
    build: ./frontend  # или используйте image
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api  # Переменная окружения для фронтенда
    # Проксируется через dev-tunnel на порт 5173

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: restaurant_db
    environment:
      - POSTGRES_DB=restaurant_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Optional initialization script
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # FastAPI/Uvicorn сервер
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/restaurant_db
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/restaurant_db
      - ALLOWED_ORIGINS=https://dev.proxy.example.com,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    # Проксируется через dev-tunnel на порт 8000

volumes:
  postgres_data: