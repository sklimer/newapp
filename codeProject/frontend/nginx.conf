server {
    listen 3000;
    server_name localhost;

    location / {
        root /app/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Serve static files
    location /static/ {
        alias /app/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
